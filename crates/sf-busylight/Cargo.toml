[package]
name = "sf-busylight"
description = "Kuando Busylight über hidraw: Farbe, Blinken und Klingelton"
version.workspace = true
edition.workspace = true

[dependencies]
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2", default-features = false, features = ["macos-shared-device"] }

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2", default-features = false, features = ["windows-native"] }
