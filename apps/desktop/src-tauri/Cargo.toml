[package]
name = "starclx"
description = "Desktop-App (Tauri 2)"
version.workspace = true
edition.workspace = true

[lib]
name = "starclx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sf-auth.workspace = true
sf-core.workspace = true
sf-onehub.workspace = true
sf-tls.workspace = true
sf-sip = { path = "../../../crates/sf-sip" }
sf-chat = { path = "../../../crates/sf-chat" }
sf-audio = { path = "../../../crates/sf-audio" }
sf-busylight = { path = "../../../crates/sf-busylight" }
arboard = { version = "3", default-features = false }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"
zbus = "5"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
