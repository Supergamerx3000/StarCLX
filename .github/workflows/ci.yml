name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Debug-Builds ohne volle Debuginfo, sonst wird der Platz auf dem Runner knapp
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # Release: der erste Build auf main mit einer neuen Version in Cargo.toml
  # (oder ein Tag v1.2.3 mit genau dieser Version). Alle anderen Builds
  # hängen die Laufnummer an (1.0.0+123): unterscheidbar, für apt neuer
  # als das Release und älter als das nächste.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      base: ${{ steps.v.outputs.base }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          RELEASE=0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$BASE" ]; then
              echo "::error::Tag $GITHUB_REF_NAME passt nicht zu Cargo.toml ($BASE)"
              exit 1
            fi
            RELEASE=1
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] \
              && ! gh release view "v$BASE" >/dev/null 2>&1; then
            VERSION="$BASE"
            RELEASE=1
          else
            VERSION="$BASE+${{ github.run_number }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, Release $RELEASE"

  linux:
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Platz schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Systempakete
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev \
            gnome-keyring dbus-daemon \
            cmake libssl-dev zlib1g-dev libspandsp-dev libpipewire-0.3-dev \
            libpulse-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Formatierung
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Test gegen echten Schlüsselbund
        run: |
          dbus-run-session -- sh -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null; sleep 1; \
            cargo test -p sf-auth --test system_keyring -- --ignored'

      - name: Oberfläche prüfen
        working-directory: apps/desktop
        run: |
          npm ci
          npm run check
          npm run i18n:check

      - name: Version setzen
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" apps/desktop/src-tauri/tauri.conf.json

      - name: Pakete bauen (.deb, .rpm, AppImage)
        working-directory: apps/desktop
        run: npx tauri build --bundles deb,rpm,appimage

      - name: sfctl bauen
        run: |
          cargo build --release -p sfctl
          cp target/release/sfctl "sfctl-${VERSION}-linux-x86_64"

      - uses: actions/upload-artifact@v7
        with:
          name: starclx-${{ env.VERSION }}-linux-x86_64
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            sfctl-*-linux-x86_64

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Systempakete
        run: brew install openssl@3

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

      - name: App bauen (.dmg)
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: starclx-${{ needs.version.outputs.version }}-macos-arm64
          path: target/release/bundle/dmg/*.dmg

  windows:
    needs: version
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      OPENSSL_DIR: ${{ github.workspace }}\vcpkg-openssl\installed\x64-windows-static-md
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # OpenSSL statisch mit dynamischer C-Laufzeit wie Rust; das Bauen
      # dauert, daher zwischengespeichert.
      - uses: actions/cache@v4
        id: openssl
        with:
          path: vcpkg-openssl/installed
          key: openssl-x64-windows-static-md-v1
      - name: OpenSSL (vcpkg)
        if: steps.openssl.outputs.cache-hit != 'true'
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:x64-windows-static-md `
            --x-install-root="$env:GITHUB_WORKSPACE\vcpkg-openssl\installed"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

      - name: App bauen (Installer)
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: starclx-${{ needs.version.outputs.version }}-windows-x64
          path: target/release/bundle/nsis/*.exe

      # Kam das Release dieser Version ohne Windows heraus (Build damals
      # fehlgeschlagen), den Installer nachreichen.
      - name: Installer ans bestehende Release hängen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.outputs.release != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.version.outputs.base }}
        run: |
          $assets = gh release view "v$env:BASE" --json assets --jq '.assets[].name' 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "Kein Release v$env:BASE"; exit 0 }
          if ($assets -match '\.exe$') { Write-Host "Installer schon vorhanden"; exit 0 }
          gh release upload "v$env:BASE" (Get-ChildItem target/release/bundle/nsis/*.exe).FullName

  # Linux und macOS sind Pflicht; Windows kommt mit, wenn es gebaut hat,
  # sonst reicht der Windows-Job den Installer später nach.
  release:
    needs: [version, linux, macos, windows]
    if: >-
      always() && needs.version.outputs.release == '1'
      && needs.linux.result == 'success' && needs.macos.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R dist
          # Abschnitt dieser Version aus CHANGELOG.md als Release-Text
          awk -v v="## $VERSION" '$0 ~ "^## " {p = index($0, v) == 1} p' CHANGELOG.md > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "StarCLX $VERSION" --notes-file notes.md \
            $(find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name 'sfctl-*' -o -name '*.dmg' -o -name '*.exe' \))

  # Paketquellen für apt und dnf auf GitHub Pages (Branch gh-pages). Signiert
  # mit dem Schlüssel aus dem Secret REPO_GPG_KEY; ohne Secret wird nichts
  # veröffentlicht. Es bleiben die letzten drei Versionen.
  repo:
    needs: [version, release]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      KEEP: 3
    steps:
      - name: Schlüssel vorhanden?
        id: key
        env:
          REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
        run: |
          if [ -z "$REPO_GPG_KEY" ]; then
            echo "::warning::Secret REPO_GPG_KEY fehlt, Paketquellen werden nicht aktualisiert"
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.ok == '1'

      - name: Werkzeuge und Schlüssel
        if: steps.key.outputs.ok == '1'
        env:
          REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c rpm
          echo "$REPO_GPG_KEY" | gpg --batch --import
          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          echo "FPR=$FPR" >> "$GITHUB_ENV"

      - name: Bisherige Quellen holen
        if: steps.key.outputs.ok == '1'
        run: |
          if git fetch --depth 1 origin gh-pages; then
            git worktree add site FETCH_HEAD
          else
            mkdir site
          fi
          mkdir -p site/deb/pool/main site/rpm/x86_64

      - name: Neue Pakete übernehmen
        if: steps.key.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$VERSION" -p '*.deb' -D site/deb/pool/main --clobber
          gh release download "v$VERSION" -p '*.rpm' -D site/rpm/x86_64 --clobber
          # nur die letzten $KEEP Versionen behalten
          for d in site/deb/pool/main site/rpm/x86_64; do
            ls "$d" | sort -V | head -n -"$KEEP" | while read -r f; do rm -f "$d/$f"; done
          done
          ls -R site/deb/pool site/rpm

      - name: apt-Quelle
        if: steps.key.outputs.ok == '1'
        working-directory: site/deb
        run: |
          mkdir -p dists/stable/main/binary-amd64
          apt-ftparchive packages pool > dists/stable/main/binary-amd64/Packages
          gzip -9kf dists/stable/main/binary-amd64/Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=StarCLX \
            -o APT::FTPArchive::Release::Label=StarCLX \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=amd64 \
            -o APT::FTPArchive::Release::Components=main \
            release dists/stable > dists/stable/Release
          gpg --batch --yes -u "$FPR" --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes -u "$FPR" -abs -o dists/stable/Release.gpg dists/stable/Release

      - name: dnf-Quelle
        if: steps.key.outputs.ok == '1'
        working-directory: site/rpm
        run: |
          for f in x86_64/*.rpm; do
            rpmsign --addsign --define "_gpg_name $FPR" "$f"
          done
          createrepo_c --update .
          gpg --batch --yes -u "$FPR" --detach-sign --armor repodata/repomd.xml

      - name: Schlüssel, Repo-Datei und Startseite
        if: steps.key.outputs.ok == '1'
        working-directory: site
        run: |
          BASE="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          gpg --armor --export "$FPR" > starclx.asc
          gpg --export "$FPR" > starclx.gpg
          cat > starclx.repo <<REPO
          [starclx]
          name=StarCLX
          baseurl=$BASE/rpm
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=$BASE/starclx.asc
          REPO
          sed -i 's/^ *//' starclx.repo
          cat > index.html <<HTML
          <!doctype html><meta charset="utf-8"><title>StarCLX Paketquellen</title>
          <h1>StarCLX Paketquellen</h1>
          <h2>Debian / Ubuntu</h2>
          <pre>curl -fsSL $BASE/starclx.gpg | sudo tee /usr/share/keyrings/starclx.gpg &gt;/dev/null
          echo "deb [signed-by=/usr/share/keyrings/starclx.gpg] $BASE/deb stable main" | sudo tee /etc/apt/sources.list.d/starclx.list
          sudo apt update &amp;&amp; sudo apt install starclx</pre>
          <h2>Fedora / openSUSE</h2>
          <pre>sudo curl -fsSL -o /etc/yum.repos.d/starclx.repo $BASE/starclx.repo
          sudo dnf install starclx</pre>
          HTML
          touch .nojekyll

      - name: Veröffentlichen
        if: steps.key.outputs.ok == '1'
        working-directory: site
        run: |
          # Ohne Historie, damit der Branch nicht mit alten Paketen wächst
          rm -rf .git
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Paketquellen für $VERSION"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
