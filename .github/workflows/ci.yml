name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  # Debug-Builds ohne volle Debuginfo, sonst wird der Platz auf dem Runner knapp
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Platz schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Systempakete
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev \
            gnome-keyring dbus-daemon \
            cmake libssl-dev zlib1g-dev libspandsp-dev libpipewire-0.3-dev \
            libpulse-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Formatierung
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Test gegen echten Schlüsselbund
        run: |
          dbus-run-session -- sh -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null; sleep 1; \
            cargo test -p sf-auth --test system_keyring -- --ignored'

      - name: Oberfläche prüfen
        working-directory: apps/desktop
        run: |
          npm ci
          npm run check
          npm run i18n:check

      # Ein Tag v1.2.3 baut genau diese Version (muss zu Cargo.toml passen).
      # Alle anderen Builds hängen die Laufnummer an (1.0.0+123): unterscheidbar,
      # für apt neuer als das Release und älter als das nächste.
      - name: Version setzen
        run: |
          BASE=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$BASE" ]; then
              echo "::error::Tag $GITHUB_REF_NAME passt nicht zu Cargo.toml ($BASE)"
              exit 1
            fi
          else
            VERSION="$BASE+${{ github.run_number }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" apps/desktop/src-tauri/tauri.conf.json
          grep -m1 '^version' Cargo.toml
          grep '"version"' apps/desktop/src-tauri/tauri.conf.json

      - name: Pakete bauen (.deb, AppImage)
        working-directory: apps/desktop
        run: npx tauri build --bundles deb,appimage

      - name: sfctl bauen
        run: cargo build --release -p sfctl

      - uses: actions/upload-artifact@v7
        with:
          name: starclx-${{ env.VERSION }}-linux-x86_64
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/sfctl

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/release/sfctl "sfctl-${VERSION}-linux-x86_64"
          # Abschnitt dieser Version aus CHANGELOG.md als Release-Text
          awk -v v="## $VERSION" '$0 ~ "^## " {p = index($0, v) == 1} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "StarCLX $VERSION" --notes-file notes.md \
            target/release/bundle/deb/*.deb \
            target/release/bundle/appimage/*.AppImage \
            "sfctl-${VERSION}-linux-x86_64"
