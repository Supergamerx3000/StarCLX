name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  # Debug-Builds ohne volle Debuginfo, sonst wird der Platz auf dem Runner knapp
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  build:
    # 22.04 statt 24.04: glibc 2.35, damit die Pakete auch unter Debian 12
    # und Ubuntu 22.04 starten (mit 24.04 gebaut verlangen sie glibc 2.38)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Platz schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Systempakete
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev \
            gnome-keyring dbus-daemon \
            cmake libssl-dev zlib1g-dev libspandsp-dev libpipewire-0.3-dev \
            libpulse-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Eigener Cache je Ubuntu-Version: Mit 24.04 gebaute C-Teile
          # (aws-lc-sys) verweisen auf glibc-2.38-Symbole und linken auf
          # 22.04 nicht.
          key: ubuntu-22.04

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Formatierung
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Test gegen echten Schlüsselbund
        run: |
          dbus-run-session -- sh -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null; sleep 1; \
            cargo test -p sf-auth --test system_keyring -- --ignored'

      - name: Oberfläche prüfen
        working-directory: apps/desktop
        run: |
          npm ci
          npm run check
          npm run i18n:check

      # Release: der erste Build auf main mit einer neuen Version in Cargo.toml
      # (oder ein Tag v1.2.3 mit genau dieser Version). Alle anderen Builds
      # hängen die Laufnummer an (1.0.0+123): unterscheidbar, für apt neuer
      # als das Release und älter als das nächste.
      - name: Version setzen
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          RELEASE=0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$BASE" ]; then
              echo "::error::Tag $GITHUB_REF_NAME passt nicht zu Cargo.toml ($BASE)"
              exit 1
            fi
            RELEASE=1
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] \
              && ! gh release view "v$BASE" >/dev/null 2>&1; then
            VERSION="$BASE"
            RELEASE=1
          else
            VERSION="$BASE+${{ github.run_number }}"
          fi
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" apps/desktop/src-tauri/tauri.conf.json
          grep -m1 '^version' Cargo.toml
          grep '"version"' apps/desktop/src-tauri/tauri.conf.json

      - name: Pakete bauen (.deb, .rpm, AppImage)
        working-directory: apps/desktop
        run: npx tauri build --bundles deb,rpm,appimage

      - name: sfctl bauen
        run: cargo build --release -p sfctl

      - uses: actions/upload-artifact@v7
        with:
          name: starclx-${{ env.VERSION }}-linux-x86_64
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/sfctl

      - name: Release veröffentlichen
        if: env.RELEASE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/release/sfctl "sfctl-${VERSION}-linux-x86_64"
          # Abschnitt dieser Version aus CHANGELOG.md als Release-Text
          awk -v v="## $VERSION" '$0 ~ "^## " {p = index($0, v) == 1} p' CHANGELOG.md > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "StarCLX $VERSION" --notes-file notes.md \
            target/release/bundle/deb/*.deb \
            target/release/bundle/rpm/*.rpm \
            target/release/bundle/appimage/*.AppImage \
            "sfctl-${VERSION}-linux-x86_64"

  # Flatpak aus dem eben gebauten .deb (packaging/flatpak), bei einem
  # Release auch als Datei im Release
  flatpak:
    needs: build
    runs-on: ubuntu-24.04
    # Werkzeuge und GNOME-Laufzeit wie beim Bau auf Flathub
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: starclx-${{ needs.build.outputs.version }}-linux-x86_64
          path: dl

      - uses: actions/cache@v5
        with:
          path: packaging/flatpak/.flatpak-builder
          key: flatpak-builder-${{ hashFiles('packaging/flatpak/ch.crazmoe.StarCLX.yml') }}

      - name: Flatpak bauen
        env:
          # Im Container gibt es kein FUSE
          FLATPAK_BUILDER_ARGS: --disable-rofiles-fuse
        run: |
          dbus-uuidgen --ensure
          packaging/flatpak/build.sh dl/bundle/deb/*.deb
          mv packaging/flatpak/starclx.flatpak "starclx_${VERSION}_x86_64.flatpak"

      - name: Flatpak prüfen
        run: |
          flatpak build packaging/flatpak/build sh -c '
            ldd /app/bin/starclx
            ls /app/lib/libayatana-appindicator3.so.1
            ! ldd /app/bin/starclx | grep "not found"'

      - uses: actions/upload-artifact@v7
        with:
          name: starclx-${{ needs.build.outputs.version }}-flatpak
          path: starclx_*.flatpak

  # Flathub-Variante (packaging/flathub): Bau aus dem Quellcode wie auf
  # Flathub, dazu die Dateien für das Flathub-Repo als Artefakt
  flathub:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/cache@v5
        with:
          path: packaging/flathub/.flatpak-builder
          key: flathub-builder-${{ hashFiles('packaging/flathub/io.github.crazmoe.StarCLX.yml', 'Cargo.lock', 'apps/desktop/package-lock.json') }}
          restore-keys: flathub-builder-

      - name: Quelllisten erzeugen
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/flathub/prepare.sh --submission "$GITHUB_SHA"

      - name: Bauen
        working-directory: packaging/flathub
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo \
            build io.github.crazmoe.StarCLX.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo starclx-flathub.flatpak io.github.crazmoe.StarCLX

      - name: Prüfen
        working-directory: packaging/flathub
        run: |
          flatpak build build sh -c '
            ldd /app/bin/starclx
            ! ldd /app/bin/starclx | grep "not found"'

      # Hinweise der Flathub-Prüfung; Fehler hier verhindern den Build nicht
      - name: Flathub-Linter
        continue-on-error: true
        working-directory: packaging/flathub
        run: |
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest io.github.crazmoe.StarCLX.yml
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo

      - uses: actions/upload-artifact@v7
        with:
          name: starclx-flathub
          path: |
            packaging/flathub/starclx-flathub.flatpak
            packaging/flathub/submission

  # Im Container fehlt gh, deshalb ein eigener Schritt für das Release
  flatpak-release:
    needs: [build, flatpak]
    if: needs.build.outputs.release == '1'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: starclx-${{ needs.build.outputs.version }}-flatpak
      - name: Release ergänzen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" "starclx_${VERSION}_x86_64.flatpak" --clobber --repo "$GITHUB_REPOSITORY"

  # Paketquellen für apt und dnf auf GitHub Pages (Branch gh-pages). Signiert
  # mit dem Schlüssel aus dem Secret REPO_GPG_KEY; ohne Secret wird nichts
  # veröffentlicht. Es bleiben die letzten drei Versionen.
  repo:
    needs: build
    if: needs.build.outputs.release == '1'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      KEEP: 3
    steps:
      - name: Schlüssel vorhanden?
        id: key
        env:
          REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
        run: |
          if [ -z "$REPO_GPG_KEY" ]; then
            echo "::warning::Secret REPO_GPG_KEY fehlt, Paketquellen werden nicht aktualisiert"
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.ok == '1'

      - name: Werkzeuge und Schlüssel
        if: steps.key.outputs.ok == '1'
        env:
          REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c rpm
          echo "$REPO_GPG_KEY" | gpg --batch --import
          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          echo "FPR=$FPR" >> "$GITHUB_ENV"

      - name: Bisherige Quellen holen
        if: steps.key.outputs.ok == '1'
        run: |
          if git fetch --depth 1 origin gh-pages; then
            git worktree add site FETCH_HEAD
          else
            mkdir site
          fi
          mkdir -p site/deb/pool/main site/rpm/x86_64

      - name: Neue Pakete übernehmen
        if: steps.key.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$VERSION" -p '*.deb' -D site/deb/pool/main --clobber
          gh release download "v$VERSION" -p '*.rpm' -D site/rpm/x86_64 --clobber
          # nur die letzten $KEEP Versionen behalten
          for d in site/deb/pool/main site/rpm/x86_64; do
            ls "$d" | sort -V | head -n -"$KEEP" | while read -r f; do rm -f "$d/$f"; done
          done
          ls -R site/deb/pool site/rpm

      - name: apt-Quelle
        if: steps.key.outputs.ok == '1'
        working-directory: site/deb
        run: |
          mkdir -p dists/stable/main/binary-amd64
          apt-ftparchive packages pool > dists/stable/main/binary-amd64/Packages
          gzip -9kf dists/stable/main/binary-amd64/Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=StarCLX \
            -o APT::FTPArchive::Release::Label=StarCLX \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=amd64 \
            -o APT::FTPArchive::Release::Components=main \
            release dists/stable > dists/stable/Release
          gpg --batch --yes -u "$FPR" --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes -u "$FPR" -abs -o dists/stable/Release.gpg dists/stable/Release

      - name: dnf-Quelle
        if: steps.key.outputs.ok == '1'
        working-directory: site/rpm
        run: |
          for f in x86_64/*.rpm; do
            rpmsign --addsign --define "_gpg_name $FPR" "$f"
          done
          createrepo_c --update .
          gpg --batch --yes -u "$FPR" --detach-sign --armor repodata/repomd.xml

      - name: Schlüssel, Repo-Datei und Startseite
        if: steps.key.outputs.ok == '1'
        working-directory: site
        run: |
          BASE="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          gpg --armor --export "$FPR" > starclx.asc
          gpg --export "$FPR" > starclx.gpg
          cat > starclx.repo <<REPO
          [starclx]
          name=StarCLX
          baseurl=$BASE/rpm
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=$BASE/starclx.asc
          REPO
          sed -i 's/^ *//' starclx.repo
          cat > index.html <<HTML
          <!doctype html><meta charset="utf-8"><title>StarCLX Paketquellen</title>
          <h1>StarCLX Paketquellen</h1>
          <h2>Debian / Ubuntu</h2>
          <pre>curl -fsSL $BASE/starclx.gpg | sudo tee /usr/share/keyrings/starclx.gpg &gt;/dev/null
          echo "deb [signed-by=/usr/share/keyrings/starclx.gpg] $BASE/deb stable main" | sudo tee /etc/apt/sources.list.d/starclx.list
          sudo apt update &amp;&amp; sudo apt install starclx</pre>
          <h2>Fedora / openSUSE</h2>
          <pre>sudo curl -fsSL -o /etc/yum.repos.d/starclx.repo $BASE/starclx.repo
          sudo dnf install starclx</pre>
          HTML
          touch .nojekyll

      - name: Veröffentlichen
        if: steps.key.outputs.ok == '1'
        working-directory: site
        run: |
          # Ohne Historie, damit der Branch nicht mit alten Paketen wächst
          rm -rf .git
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Paketquellen für $VERSION"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
