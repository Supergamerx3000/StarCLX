name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Debug-Builds ohne volle Debuginfo, sonst wird der Platz auf dem Runner knapp
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Platz schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Systempakete
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev \
            gnome-keyring dbus-daemon \
            cmake libssl-dev zlib1g-dev libspandsp-dev libpipewire-0.3-dev \
            libpulse-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Formatierung
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Test gegen echten Schlüsselbund
        run: |
          dbus-run-session -- sh -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null; sleep 1; \
            cargo test -p sf-auth --test system_keyring -- --ignored'

      - name: Oberfläche prüfen
        working-directory: apps/desktop
        run: |
          npm ci
          npm run check
          npm run i18n:check

      # Jeder Build bekommt eine eigene, steigende Version (0.1.<Laufnummer>),
      # damit Pakete unterscheidbar sind und apt sie als Update erkennt.
      - name: Version setzen
        run: |
          VERSION="0.1.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" apps/desktop/src-tauri/tauri.conf.json
          grep -m1 '^version' Cargo.toml
          grep '"version"' apps/desktop/src-tauri/tauri.conf.json

      - name: Pakete bauen (.deb, AppImage)
        working-directory: apps/desktop
        run: npx tauri build --bundles deb,appimage

      - name: sfctl bauen
        run: cargo build --release -p sfctl

      - uses: actions/upload-artifact@v7
        with:
          name: starclx-${{ env.VERSION }}-linux-x86_64
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/sfctl
